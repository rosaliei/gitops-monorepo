# Defaults for every service. Each environment file only overrides what differs:
#   environments/<env>/<app>.yaml
# Final config = this file + the environment file (the environment file wins).

# Shown to the app as APP_ENV.
environment: local

# Which container image to run.
image:
  repository: ""            # e.g. ghcr.io/rosaliei/orders-api
  tag: ""                   # a release (1.2.0) or a CI build (sha-abc1234). Never "latest".
  digest: ""                # optional sha256:... pins the exact image CI tested and signed
  pullPolicy: IfNotPresent  # only download the image if the node doesn't have it yet

replicaCount: 1             # how many pods (ignored when autoscaling is enabled)
containerPort: 8080         # the port the app listens on inside the container

# Plain, non-secret configuration.  NAME: value  ->  environment variable in the pod
env: {}

# Secrets are never stored in Git. External Secrets Operator copies them from a secret
# store (AWS Secrets Manager, Vault, ...) into a Kubernetes Secret.  ENV_NAME: remote-key
secretEnv:
  enabled: false
  store: demo-store         # a ClusterSecretStore
  data: {}

# Health checks Kubernetes calls on the app.
probes:
  liveness: /healthz        # fails -> Kubernetes restarts the container
  readiness: /readyz        # fails -> the pod gets no traffic (used during rollouts)

# requests = what the scheduler reserves for the pod; limits = the hard maximum.
resources:
  requests:
    cpu: 50m                # 50m = 5% of one CPU core
    memory: 64Mi
  limits:
    memory: 128Mi           # above this the container is killed (OOMKilled). No CPU limit on purpose: avoids throttling.

# The root filesystem is read-only; list any folders the app must write to.
writableDirs:
  - /tmp

# HorizontalPodAutoscaler: adds/removes pods based on CPU. Used in prod.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70             # add pods when average CPU is above 70% of the request

# ServiceMonitor for Prometheus Operator (the app must expose /metrics).
metrics:
  enabled: false
  path: /metrics

# The Service is the stable in-cluster address: http://<app>.<namespace>:80
service:
  port: 80
