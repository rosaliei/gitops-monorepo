{{- if .Values.secretEnv.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretEnv.store }}
  target:
    name: {{ .Release.Name }}-secrets
  data:
    {{- range $name, $remoteKey := .Values.secretEnv.data }}
    - secretKey: {{ $name }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
{{- end }}
