# Git is the only way to change a GitOps namespace.
#
# Why: ArgoCD self-heal only reverts fields ArgoCD owns. With server-side apply, a field added
# by hand (kubectl edit, Rancher UI) is owned by someone else, so ArgoCD ignores it and the
# drift stays. Rejecting the change at admission time means drift never happens.
#
# Allowed: the ArgoCD application controller and Kubernetes' own controllers (kube-system).
# Blocked: everyone else, including cluster-admin, for UPDATE and DELETE.
# Break-glass: remove the gitops.demo/protected label from the namespace (and audit it).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy             # built into Kubernetes 1.30+, rules written in CEL
metadata:
  name: block-manual-changes
spec:
  failurePolicy: Fail                       # if the policy cannot be evaluated, reject (safe default)
  matchConstraints:                         # WHICH requests this policy looks at
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE", "DELETE"]
        resources: ["deployments", "deployments/scale"]   # scale is a subresource: kubectl scale
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE", "DELETE"]
        resources: ["services", "configmaps"]  # kubectl edit/delete on services and configmaps
      - apiGroups: ["autoscaling"]
        apiVersions: ["v2"]
        operations: ["UPDATE", "DELETE"]
        resources: ["horizontalpodautoscalers"]  # kubectl edit/delete on the HPA
  validations:                              # the request is allowed only if this expression is true
    - expression: >-
        request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller' ||
        request.userInfo.username.startsWith('system:serviceaccount:kube-system:') ||
        request.userInfo.username.startsWith('system:kube-')
      messageExpression: >-                 # the error message the user sees
        'Manual changes are blocked in GitOps namespaces (you are ' + request.userInfo.username +
        '). Change the files in Git instead - ArgoCD will apply them.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding      # the binding switches the policy ON and says WHERE
metadata:
  name: block-manual-changes
spec:
  policyName: block-manual-changes
  validationActions: ["Deny"]               # reject the request (other options: Warn, Audit)
  matchResources:
    namespaceSelector:                      # only namespaces with this label (ArgoCD adds it to demo-dev/qa/prod)
      matchLabels:
        gitops.demo/protected: "true"
