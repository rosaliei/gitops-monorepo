# Grafana loads any ConfigMap labelled grafana_dashboard=1 (kube-prometheus-stack sidecar).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-gitops-delivery
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gitops-delivery.json: |
    {
      "uid": "gitops-delivery",
      "title": "GitOps Delivery",
      "description": "Is Git in sync with the cluster, and how often do we deploy?",
      "tags": [
        "gitops-demo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Apps out of sync",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "description": "Git and the cluster disagree. Should be 0 except for a minute after a merge."
        },
        {
          "id": 2,
          "title": "Apps not healthy",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info{health_status!=\"Healthy\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "title": "Successful syncs (24h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(argocd_app_sync_total{phase=\"Succeeded\"}[24h]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "description": "Deployment frequency (DORA)."
        },
        {
          "id": 4,
          "title": "Failed syncs (24h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(argocd_app_sync_total{phase=~\"Error|Failed\"}[24h])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "title": "What version runs where",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (namespace, job, version, commit) (app_build_info)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "description": "Reported by each running app (app_build_info). Compare dev / qa / prod at a glance.",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                }
              }
            }
          ]
        },
        {
          "id": 6,
          "title": "ArgoCD applications",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (name, dest_namespace, sync_status, health_status) (argocd_app_info)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "title": "Syncs per app",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (name) (increase(argocd_app_sync_total[1h]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        }
      ]
    }
