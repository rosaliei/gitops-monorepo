# Sized for a laptop (kind). Components that cannot be scraped on kind are turned off.
kubeEtcd:                                   # control-plane parts kind does not expose to scrape
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
nodeExporter:
  enabled: false        # needs host mounts that Docker Desktop does not provide

# Prometheus = collects metrics and evaluates alert rules
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / rules from every namespace, not just this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false  # without this, our ServiceMonitors in demo-* would be ignored
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false    # same for PrometheusRules (alerts.yaml)
    retention: 2d                           # keep 2 days of metrics (laptop disk)
    resources:
      requests:
        cpu: 100m
        memory: 400Mi

# Alertmanager = receives firing alerts, groups them, sends to Slack/PagerDuty
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

# Grafana = dashboards on top of Prometheus
grafana:
  adminPassword: admin   # demo only. Real clusters: grafana.admin.existingSecret + ExternalSecret
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL                  # load dashboard ConfigMaps from every namespace
