# EKS version of platform/manifests/secrets/cluster-secret-store.yaml.
# Same store name ("demo-store"), so no app changes: only where the secrets come from changes.
# Secrets live in AWS Secrets Manager, e.g. "prod/orders-api/api-key".
# The ESO service account gets read access through EKS Pod Identity (no static AWS keys).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: demo-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
