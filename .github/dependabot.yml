# Keep the GitHub Actions used by this repo patched.
# App dependencies and base images are updated in the app repo (github.com/rosaliei/gitops-apps).
# Helm chart versions (argocd/apps/*.yaml) and Terraform modules are upgraded on purpose, in a reviewed PR.
version: 2                                  # Dependabot config format
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }         # one batch of PRs per month (less noise)
    commit-message: { prefix: "chore(deps)" }
    groups:                                 # one PR for all updates, not one per action
      actions: { patterns: ["*"] }
