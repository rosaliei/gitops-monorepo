# Apps CI/CD - owned by the app team, runs when gitops-apps/ changes.
#
#   pull request  ->  test  +  e2e  +  build & scan                     (nothing is published)
#   merge to main ->  same checks, then push + sign images,
#                     commit the new image to gitops-config/environments/dev   (ArgoCD deploys dev)
#                     if a version was released, open a PR for gitops-config/environments/qa
#
# This pipeline never touches the cluster: it only writes to the registry and to gitops-config/.
# Only the apps that changed are tested and built (path filters).
name: Apps CI/CD

on:
  pull_request:                             # 1. on every PR: check only
    paths:
      - "gitops-apps/**"
      - ".github/workflows/apps-ci.yaml"
      - ".github/workflows/_test.yaml"
      - ".github/workflows/_build.yaml"
  push:                                     # 2. on merge to main: check, publish, deploy dev
    branches: [main]
    paths:
      - "gitops-apps/**"
      - ".github/workflows/apps-ci.yaml"
      - ".github/workflows/_test.yaml"
      - ".github/workflows/_build.yaml"
  workflow_dispatch:   # re-run everything by hand (builds all apps)

concurrency:                                # one run per PR / commit
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new PR push cancels the old run; main runs always finish

permissions:                                # least privilege: read-only by default, jobs ask for more
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Job 1: which apps changed? Output is a JSON list used by the jobs below.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            orders-api: ["gitops-apps/orders-api/**"]
            inventory-svc: ["gitops-apps/inventory-svc/**"]
            web-frontend: ["gitops-apps/web-frontend/**"]
      - name: apps to build
        id: apps
        run: |
          # First push to a new repo or a manual run: build everything.
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
            apps='["orders-api","inventory-svc","web-frontend"]'
          else
            apps='${{ steps.filter.outputs.changes }}'
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Apps to build: \`$apps\`" >> "$GITHUB_STEP_SUMMARY"

  # Job 2: lint + unit tests, one parallel job per changed app.
  test:
    needs: changes
    if: needs.changes.outputs.apps != '[]'  # skip when no app changed
    strategy:
      fail-fast: false                      # one app failing does not cancel the others
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}  # one job per changed app, e.g. ["orders-api"]
    name: test (${{ matrix.app }})
    uses: ./.github/workflows/_test.yaml    # reusable workflow: same test steps for every app
    with:
      app: ${{ matrix.app }}

  # Job 3: install the real chart on a throwaway kind cluster and smoke-test (runs in parallel with test).
  e2e:
    name: e2e (kind)
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      - uses: helm/kind-action@v1
        with:
          version: v0.31.0
          install_only: true
      - run: gitops-config/scripts/e2e.sh   # builds the app images, installs them with the devops chart

  # Job 4: build the image once, scan it (Trivy), and on main push + sign it.
  build:
    needs: [changes, test, e2e]             # only build if tests and e2e passed
    if: needs.changes.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    name: build (${{ matrix.app }})
    permissions:
      contents: read
      packages: write                       # push images to ghcr.io
      id-token: write                       # keyless cosign signing (GitHub OIDC)
    uses: ./.github/workflows/_build.yaml
    with:
      app: ${{ matrix.app }}
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}  # PRs build + scan only; main also pushes

  # Job 5: "deploy" = commit the new tag+digest into gitops-config/environments/dev. ArgoCD does the rest.
  deploy-dev:
    name: deploy dev (+ qa PR on release)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'  # never on PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # commit to gitops-config/environments/dev
      pull-requests: write   # open the qa promotion PR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*                  # one small JSON per built app: app, tag, digest, version
          path: .out/images
          merge-multiple: true

      - name: deploy to dev = commit to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg=""
          for f in .out/images/*.json; do
            app=$(jq -r .app "$f"); tag=$(jq -r .tag "$f"); digest=$(jq -r .digest "$f")
            gitops-config/scripts/set-image.sh dev "$app" "$tag" "$digest"
            msg="$msg $app:$tag"
          done
          git add gitops-config/environments/dev
          git commit -m "chore(dev): deploy$msg"
          # Several pipelines may finish at once: rebase and retry instead of failing.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push rejected, retry $i"; sleep $((i * 3))
          done
          exit 1

      # Only if a NEW version was built (version.txt holds a version not yet in the registry): stage the qa change...
      - name: prepare qa promotion for new releases
        id: qa
        run: |
          apps=""
          for f in .out/images/*.json; do
            if [ "$(jq -r .new_release "$f")" = true ]; then
              app=$(jq -r .app "$f"); version=$(jq -r .version "$f")
              gitops-config/scripts/set-image.sh qa "$app" "$version" "$(jq -r .digest "$f")"
              apps="$apps $app:$version"
            fi
          done
          echo "apps=${apps# }" >> "$GITHUB_OUTPUT"

      # ...and open a PR. A human merges it = deploy qa.
      - name: open qa promotion PR
        if: steps.qa.outputs.apps != ''
        uses: peter-evans/create-pull-request@v8
        with:
          branch: promote/qa-${{ github.sha }}
          commit-message: "chore(qa): promote ${{ steps.qa.outputs.apps }}"
          title: "chore(qa): promote ${{ steps.qa.outputs.apps }}"
          labels: promotion
          body: |
            New release built from ${{ github.sha }} and running in **dev**.
            Merging this PR deploys the **same image digest** to **qa** (ArgoCD syncs within a minute).

            - [ ] dev looks good (GitOps Delivery dashboard / smoke test)
            - [ ] release notes checked (GitHub Releases)

            Next step after qa: **Actions -> Promote to production**.

  # Job 6: summary table on the run page (+ Slack if configured).
  report:
    name: pipeline report
    needs: [changes, test, e2e, build, deploy-dev]
    if: always()                            # runs even when something failed, so you always get a report
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: summary
        run: |
          {
            echo "## Pipeline result"
            echo "| stage | result |"
            echo "|---|---|"
            echo "| apps | \`${{ needs.changes.outputs.apps }}\` |"
            echo "| unit tests | ${{ needs.test.result }} |"
            echo "| e2e (kind) | ${{ needs.e2e.result }} |"
            echo "| build / scan / sign | ${{ needs.build.result }} |"
            echo "| deploy dev | ${{ needs.deploy-dev.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Optional: add a repo secret SLACK_WEBHOOK_URL to get pipeline results in Slack.
      - name: notify slack
        if: github.event_name != 'pull_request' && env.SLACK_WEBHOOK_URL != ''
        run: |
          status="${{ contains(needs.*.result, 'failure') && ':x: failed' || ':white_check_mark: passed' }}"
          text="CI/CD $status for \`${GITHUB_SHA::7}\` (${{ needs.changes.outputs.apps }}) - $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sf -X POST -H 'Content-Type: application/json' -d "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL" || echo "slack notify failed (ignored)"
