# Security checks that are not tied to one app build.
#   gitleaks - no secrets in the code or in the Git history (blocks the PR)
#   trivy    - vulnerable dependencies + misconfigurations in Dockerfiles, Helm, Terraform
#              (reported to the GitHub Security tab; image CVEs are gated in the build)
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly: new CVEs appear without any code change
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  trivy:
    name: dependencies + misconfig (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: scan
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.74.0 fs /repo \
            --scanners vuln,misconfig --severity HIGH,CRITICAL --skip-dirs /repo/.out \
            --format sarif --output /repo/trivy.sarif
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.74.0 fs /repo \
            --scanners vuln,misconfig --severity HIGH,CRITICAL --skip-dirs /repo/.out --quiet \
            | tee trivy.txt
          { echo '### Trivy (report only)'; echo '```'; tail -n 60 trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
