# Terraform checks for infra/eks. Nothing is applied from CI (no cloud credentials here);
# apply is a deliberate, reviewed step (see docs/eks-and-rancher.md).
name: Terraform

on:
  pull_request:
    paths: ["infra/eks/**", ".github/workflows/terraform.yaml"]
  push:
    branches: [main]
    paths: ["infra/eks/**", ".github/workflows/terraform.yaml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/eks
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
