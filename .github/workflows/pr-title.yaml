# PR titles must follow Conventional Commits (feat:, fix:, chore: ...).
# With squash-merge the PR title becomes the commit message: a readable deploy history (git log environments/).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]  # re-check when the title is edited

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |                          # allowed prefixes; only feat/fix (and !) change the version
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            revert
