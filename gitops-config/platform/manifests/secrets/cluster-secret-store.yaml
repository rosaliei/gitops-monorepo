# LOCAL DEMO ONLY: the "fake" provider keeps demo values inside the store so the whole repo
# runs on a laptop with no cloud account. These are not real secrets.
# On EKS this file is replaced by infra/eks/cluster-secret-store-aws.yaml (AWS Secrets Manager
# + IRSA). The apps do not change: they only reference the store name "demo-store".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: demo-store
spec:
  provider:
    fake:
      data:
        - key: dev/orders-api/api-key
          value: demo-value-for-dev
        - key: qa/orders-api/api-key
          value: demo-value-for-qa
        - key: prod/orders-api/api-key
          value: demo-value-for-prod
