# Grafana loads any ConfigMap labelled grafana_dashboard=1 (kube-prometheus-stack sidecar).
# The dashboard itself is the JSON below (exported from Grafana). Change it in Grafana, export, paste here.
apiVersion: v1
kind: ConfigMap                             # a dashboard is just a ConfigMap; Git owns it, so UI edits are lost on restart
metadata:
  name: dashboard-gitops-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"                  # this label is what makes Grafana pick it up
data:
  gitops-services.json: |
    {
      "uid": "gitops-services",
      "title": "Services (RED)",
      "description": "Rate, Errors, Duration for every service in every environment.",
      "tags": [
        "gitops-demo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Requests / s",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, job) (rate(http_requests_total[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{job}} ({{namespace}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 2,
          "title": "Error ratio (5xx)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "job:http_error_ratio:rate5m",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{job}} ({{namespace}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {},
          "description": "SLO: below 1%. The ErrorBudgetBurnFast alert fires at 14.4%."
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "job:http_request_duration_seconds:p50_5m",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "p50 {{job}} ({{namespace}})"
            },
            {
              "refId": "B",
              "expr": "job:http_request_duration_seconds:p95_5m",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "p95 {{job}} ({{namespace}})"
            },
            {
              "refId": "C",
              "expr": "job:http_request_duration_seconds:p99_5m",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "p99 {{job}} ({{namespace}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {},
          "description": "p99 = 99 of 100 requests were faster than this line (the slow tail). Alerts: p95 > 500ms, p99 > 1s for 10m."
        },
        {
          "id": 4,
          "title": "Pod restarts (1h)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"demo-.*\"}[1h]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        }
      ]
    }
