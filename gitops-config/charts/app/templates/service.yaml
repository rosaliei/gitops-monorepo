{{/* Service: one stable name + IP in front of the pods (pods come and go, the Service stays). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:                    # send traffic to pods with these labels
    {{- include "app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http         # the container port named "http" in deployment.yaml
