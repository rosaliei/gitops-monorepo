{{- /* ExternalSecret: asks External Secrets Operator to copy secrets from the store into a normal
     Kubernetes Secret called <app>-secrets. Git only holds the KEY NAMES, never the values. */}}
{{- if .Values.secretEnv.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h          # re-read the store every hour (picks up rotated secrets)
  secretStoreRef:              # WHERE to read from (kind: fake store, EKS: AWS Secrets Manager)
    kind: ClusterSecretStore
    name: {{ .Values.secretEnv.store }}
  target:                      # the Kubernetes Secret it creates (the Deployment reads this)
    name: {{ .Release.Name }}-secrets
  data:
    {{- range $name, $remoteKey := .Values.secretEnv.data }}
    - secretKey: {{ $name }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
{{- end }}
