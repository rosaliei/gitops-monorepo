{{- /* ServiceMonitor: tells Prometheus "scrape the Service with these labels, on port http, every 15s". */}}
{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  endpoints:
    - port: http                 # port NAME on the Service (not the number)
      path: {{ .Values.metrics.path }}
      interval: 15s
{{- end }}
