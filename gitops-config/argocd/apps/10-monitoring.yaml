# kube-prometheus-stack: Prometheus, Alertmanager, Grafana.
# Two sources: the public chart + our values file from this repo ($values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"       # wave 0: install with the other add-ons
spec:
  project: platform                         # see 00-projects.yaml
  sources:                                  # two sources: a chart from one place, values from another
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.5.0                # pinned chart version
      helm:
        releaseName: monitoring             # prefix for every object name (monitoring-grafana, ...)
        valueFiles:
          - $values/gitops-config/platform/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/rosaliei/gitops-monorepo.git
      targetRevision: main
      ref: values                           # gives this Git repo the name $values (used above)
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:                              # sync on its own when Git changes (no "Sync" button needed)
      prune: true                           # delete from the cluster what was deleted from Git
      selfHeal: true                        # put back anything changed by hand in the cluster
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the CRDs are too big for client-side apply
