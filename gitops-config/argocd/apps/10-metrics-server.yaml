# metrics-server: CPU/memory metrics for the HorizontalPodAutoscaler (prod uses HPA).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"       # wave 0: install with the other add-ons
spec:
  project: platform                         # see 00-projects.yaml
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0                  # pinned chart version
    helm:
      valuesObject:                         # Helm values written inline (small enough, no separate file)
        args:
          - --kubelet-insecure-tls   # kind's kubelet uses self-signed certs. Remove on EKS.
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:                              # sync on its own when Git changes (no "Sync" button needed)
      prune: true                           # delete from the cluster what was deleted from Git
      selfHeal: true                        # put back anything changed by hand in the cluster
