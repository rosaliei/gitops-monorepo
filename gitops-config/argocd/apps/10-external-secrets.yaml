# External Secrets Operator: copies secrets from a secret store into Kubernetes Secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"       # wave 0: add-ons install before our config (wave 1) and apps (wave 2)
spec:
  project: platform                         # see 00-projects.yaml
  source:
    repoURL: https://charts.external-secrets.io  # a public Helm chart repo, not Git
    chart: external-secrets
    targetRevision: 2.11.0                  # pinned chart version; upgrade = change this number in a PR
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:                              # sync on its own when Git changes (no "Sync" button needed)
      prune: true                           # delete from the cluster what was deleted from Git
      selfHeal: true                        # put back anything changed by hand in the cluster
    syncOptions:
      - CreateNamespace=true                # create the namespace if it does not exist
      - ServerSideApply=true                # large CRDs do not fit in client-side apply
