# prod: only the 'promote' workflow changes this, after approval (merge = deploy).
# Chart defaults: charts/app/values.yaml
environment: prod

image:
  repository: ghcr.io/rosaliei/orders-api
  tag: "0.2.0"
  digest: "sha256:f9d76136f75a2fe5ffe40ce80f47a5b71552b95b8d5a51b58abca25e323a439f"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

env:
  LOG_LEVEL: info

secretEnv:
  enabled: true
  data:
    API_KEY: prod/orders-api/api-key

metrics:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    memory: 192Mi
